<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">Omnia coder-modern palette board</title>
  <desc id="desc">Ten neutral-first palettes with one signal accent each.</desc>
  <rect width="1440" height="920" fill="#0d1117"/>
