name: Omnia rebuild gates

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:rebuild-gates
      - run: npm run rebuild:check
      - name: Validate active cycle and canonical document hashes
        run: node scripts/rebuild/validate.mjs
      - run: node scripts/rebuild/architecture-guard.mjs
