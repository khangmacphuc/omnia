name: fast-feedback

on:
  push:
    branches: [main, master, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fast-feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-fast:
    name: Fast renderer feedback
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Typecheck and fast renderer build
        run: npm run check:fast
