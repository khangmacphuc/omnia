[package]
name = "omnia-browser"
version = "0.1.0"
description = "Omnia browser control over the Chrome DevTools Protocol, plus agent browser tools"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
omnia-harness = { path = "../omnia-harness" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util", "net"] }
tokio-tungstenite = "0.26"
tokio-util = "0.7"
url = "2"

[dev-dependencies]
tempfile = "3"
